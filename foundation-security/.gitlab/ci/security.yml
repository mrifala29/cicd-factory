# ============================================================
# SECURITY CHECKS (STAGE: check)
# Tools:
# - GitLeaks (Secret Scanning)
# - Trivy (SAST & Misconfig)
# - Semgrep (Code Scanning)
# - Snyk Open Source (SCA Dependency Scanning)
# - Snyk Container (Container Image Vulnerabilities)
# Artifacts: gitleaks.html, trivy.html, semgrep.html, snyk.html, snyk-container.html, security-reports.html
# ============================================================

# ============================================================
# 1. SECRET SCANNING - GITLEAKS (gitleaks.html)
# ============================================================

check_secret_gitleaks:
  stage: check
  allow_failure: true

  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  script:
    - |
      mkdir -p artifacts

      echo ""
      echo "============================================================"
      echo "             SECRET SCANNING - GITLEAKS"
      echo "============================================================"
      echo ""

      # Prepare HTML template for Gitleaks
      cat > /tmp/gitleaks-template.html << 'EOF'
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>GitLeaks Security Report</title>
        <style>
          body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }
          .container { max-width: 1200px; margin: 0 auto; }
          .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
          h1 { color: #38bdf8; margin: 0; font-size: 24px; }
          .back-btn { padding: 8px 14px; background: #334155; color: #e2e8f0; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 500; }
          .back-btn:hover { background: #475569; }
          p.subtitle { color: #94a3b8; margin-top: 6px; margin-bottom: 24px; font-size: 14px; }
          .card { background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
          table { width: 100%; border-collapse: collapse; margin-top: 12px; }
          th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }
          th { background: #0f172a; color: #94a3b8; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
          tr:hover { background: #273549; }
          .rule { font-weight: 600; color: #fbbf24; }
          .file { font-family: monospace; color: #38bdf8; }
          .secret { font-family: monospace; color: #f43f5e; background: #3f121e; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
          .no-findings { text-align: center; padding: 32px; color: #34d399; font-size: 16px; font-weight: bold; }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="card">
            <div class="header">
              <h1>🛡️ GitLeaks Secret Detection Report</h1>
              <a href="security-reports.html" class="back-btn">&larr; Back to Dashboard</a>
            </div>
            <p class="subtitle">Automated scan for hardcoded credentials, API keys, and sensitive tokens.</p>
            <table>
              <thead>
                <tr>
                  <th>Rule ID</th>
                  <th>Description</th>
                  <th>File</th>
                  <th>Line</th>
                  <th>Secret Snippet</th>
                  <th>Commit / Author</th>
                </tr>
              </thead>
              <tbody>
              {{range .}}
                <tr>
                  <td><span class="rule">{{.RuleID}}</span></td>
                  <td>{{.Description}}</td>
                  <td><span class="file">{{.File}}</span></td>
                  <td>{{.StartLine}}</td>
                  <td><span class="secret">{{.Secret}}</span></td>
                  <td>{{.Commit}}<br><small style="color: #94a3b8;">{{.Author}}</small></td>
                </tr>
              {{else}}
                <tr>
                  <td colspan="6" class="no-findings">✓ No hardcoded secrets or credentials detected!</td>
                </tr>
              {{end}}
              </tbody>
            </table>
          </div>
        </div>
      </body>
      </html>
      EOF

      CONFIG_ARG=""
      if [ -f .gitleaks.toml ]; then
        CONFIG_ARG="--config .gitleaks.toml"
      fi

      # 1. Output plain text report for console & markdown
      gitleaks detect \
        --source . \
        $CONFIG_ARG \
        --verbose \
        --report-format json \
        --report-path artifacts/gitleaks.json \
        > artifacts/gitleaks.md 2>&1 || true

      cat artifacts/gitleaks.md

      # 2. Output HTML report
      gitleaks detect \
        --source . \
        $CONFIG_ARG \
        --report-format template \
        --report-template /tmp/gitleaks-template.html \
        --report-path artifacts/gitleaks.html 2>/dev/null || true

      echo ""
      echo "------------------------------------------------------------"

      if [ ! -s artifacts/gitleaks.json ] || \
         [ "$(cat artifacts/gitleaks.json)" = "[]" ]; then

        RESULT="PASS"
        DETAIL="No secrets or credentials detected."
        FINDINGS=0

      else

        RESULT="REVIEW"
        DETAIL="Potential secret findings may require review."
        FINDINGS=$(grep -o '"RuleID"' artifacts/gitleaks.json | wc -l)

      fi

      echo "RESULT  : $RESULT"
      echo "DETAIL  : $DETAIL"
      echo "FINDINGS: $FINDINGS"
      echo "HTML RPT: artifacts/gitleaks.html"

      echo ""
      echo "NOTE    : This check is informational and does not block"
      echo "          the pipeline."
      echo "============================================================"
      echo ""

      cat > artifacts/gitleaks-summary.json <<EOF
      {
        "check": "gitleaks",
        "result": "$RESULT",
        "findings": $FINDINGS,
        "detail": "$DETAIL"
      }
      EOF

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/gitleaks*


# ============================================================
# 2. SAST & MISCONFIG - TRIVY (trivy.html)
# ============================================================

check_sast_trivy:
  stage: check
  allow_failure: true

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - |
      mkdir -p artifacts

      echo ""
      echo "============================================================"
      echo "                 SAST & MISCONFIG - TRIVY"
      echo "============================================================"
      echo ""

      TRIVY_DB_REPO="ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2"

      # 1. Scan and generate JSON report
      trivy fs \
        --scanners misconfig,vuln \
        --severity HIGH,CRITICAL \
        --db-repository "$TRIVY_DB_REPO" \
        --timeout 10m \
        --format json \
        --output artifacts/trivy.json \
        . 2>&1 | tee artifacts/trivy.md || true

      if [ ! -s artifacts/trivy.json ]; then
        echo "{}" > artifacts/trivy.json
      fi

      # 2. Generate HTML report (skip DB update to avoid redundant downloads)
      trivy fs \
        --scanners misconfig,vuln \
        --severity HIGH,CRITICAL \
        --skip-db-update \
        --timeout 5m \
        --format template \
        --template "@/contrib/html.tpl" \
        --output artifacts/trivy.html \
        . 2>/dev/null || true

      # 3. Fallback HTML report if trivy.html failed to generate
      if [ ! -s artifacts/trivy.html ]; then
        cat > artifacts/trivy.html << 'EOF'
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Trivy Scan Notice</title>
        <style>
          body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 32px; text-align: center; }
          .card { max-width: 600px; margin: 40px auto; background: #1e293b; padding: 32px; border-radius: 12px; border: 1px solid #334155; }
          h1 { color: #f59e0b; font-size: 20px; }
          p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
          .btn { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #334155; color: #e2e8f0; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 13px; }
        </style>
      </head>
      <body>
        <div class="card">
          <h1>⚠️ Trivy Database Notice</h1>
          <p>The vulnerability database download timed out or was temporarily unreachable during this run. No detailed HTML report was generated. The scan will automatically retry on the next pipeline.</p>
          <a href="security-reports.html" class="btn">&larr; Back to Dashboard</a>
        </div>
      </body>
      </html>
      EOF
      fi

      echo ""
      echo "------------------------------------------------------------"

      if grep -q -E '"Severity":\s*"(HIGH|CRITICAL)"' artifacts/trivy.json; then
        RESULT="REVIEW"
        DETAIL="Potential HIGH/CRITICAL issues detected by Trivy."
      else
        RESULT="PASS"
        DETAIL="No HIGH/CRITICAL SAST or misconfiguration issues detected."
      fi

      echo "RESULT  : $RESULT"
      echo "DETAIL  : $DETAIL"
      echo "HTML RPT: artifacts/trivy.html"

      echo ""
      echo "NOTE    : This check is informational and does not block"
      echo "          the pipeline."
      echo "============================================================"
      echo ""

      cat > artifacts/trivy-summary.json <<EOF
      {
        "check": "trivy-sast",
        "result": "$RESULT",
        "detail": "$DETAIL"
      }
      EOF

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/trivy*


# ============================================================
# 3. CODE SCANNING - SEMGREP (semgrep.html)
# ============================================================

check_code_semgrep:
  stage: check
  allow_failure: true

  image:
    name: semgrep/semgrep:latest
    entrypoint: [""]

  script:
    - |
      mkdir -p artifacts

      echo ""
      echo "============================================================"
      echo "                 CODE SCANNING - SEMGREP"
      echo "============================================================"
      echo ""

      # 1. Run Semgrep scan with p/default ruleset
      semgrep scan \
        --config "p/default" \
        --metrics=off \
        --json \
        --output artifacts/semgrep.json \
        . || true

      # 2. Generate markdown summary for console
      semgrep scan \
        --config "p/default" \
        --metrics=off \
        --text \
        --output artifacts/semgrep.md \
        . || true

      cat artifacts/semgrep.md

      # 3. Generate HTML report and summary JSON via built-in python
      python3 - << 'EOF'
      import json, html

      try:
          with open("artifacts/semgrep.json", "r") as f:
              data = json.load(f)
          results = data.get("results", [])
      except Exception as e:
          results = []

      findings_count = len(results)
      result_status = "PASS" if findings_count == 0 else "REVIEW"
      detail_text = "No code security issues detected." if findings_count == 0 else f"{findings_count} potential code issues detected."

      with open("artifacts/semgrep-summary.json", "w") as f:
          json.dump({
              "check": "semgrep",
              "result": result_status,
              "findings": findings_count,
              "detail": detail_text
          }, f, indent=2)

      rows = []
      for r in results:
          check_id = html.escape(str(r.get("check_id", "")))
          path = html.escape(str(r.get("path", "")))
          line = r.get("start", {}).get("line", "")
          msg = html.escape(str(r.get("extra", {}).get("message", "")))
          sev = html.escape(str(r.get("extra", {}).get("severity", "INFO")))
          code = html.escape(str(r.get("extra", {}).get("lines", "")))

          rows.append(f"""
          <tr>
            <td><span class="badge {sev.lower()}">{sev}</span></td>
            <td><span class="rule">{check_id}</span></td>
            <td><span class="file">{path}</span></td>
            <td>{line}</td>
            <td>{msg}<pre class="code"><code>{code}</code></pre></td>
          </tr>
          """)

      rows_html = "".join(rows) if rows else '<tr><td colspan="5" class="no-findings">✓ No code vulnerabilities or anti-patterns detected!</td></tr>'

      html_doc = f"""<!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Semgrep Code Security Report</title>
        <style>
          body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }}
          .container {{ max-width: 1200px; margin: 0 auto; }}
          .header {{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }}
          h1 {{ color: #38bdf8; margin: 0; font-size: 24px; }}
          .back-btn {{ padding: 8px 14px; background: #334155; color: #e2e8f0; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 500; }}
          .back-btn:hover {{ background: #475569; }}
          p.subtitle {{ color: #94a3b8; margin-top: 6px; margin-bottom: 24px; font-size: 14px; }}
          .card {{ background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }}
          table {{ width: 100%; border-collapse: collapse; margin-top: 12px; }}
          th, td {{ padding: 12px 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; vertical-align: top; }}
          th {{ background: #0f172a; color: #94a3b8; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }}
          tr:hover {{ background: #273549; }}
          .badge {{ padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }}
          .badge.error {{ background: #881337; color: #fda4af; }}
          .badge.warning {{ background: #78350f; color: #fde68a; }}
          .badge.info {{ background: #1e3a8a; color: #93c5fd; }}
          .rule {{ font-weight: 600; color: #fbbf24; font-family: monospace; font-size: 12px; }}
          .file {{ font-family: monospace; color: #38bdf8; font-size: 12px; }}
          .code {{ background: #0b1120; padding: 8px; border-radius: 4px; color: #cbd5e1; font-family: monospace; font-size: 11px; overflow-x: auto; margin-top: 6px; white-space: pre-wrap; }}
          .no-findings {{ text-align: center; padding: 32px; color: #34d399; font-size: 16px; font-weight: bold; }}
        </style>
      </head>
      <body>
        <div class="container">
          <div class="card">
            <div class="header">
              <h1>🛡️ Semgrep Code Security Report</h1>
              <a href="security-reports.html" class="back-btn">&larr; Back to Dashboard</a>
            </div>
            <p class="subtitle">Automated static code analysis scanning for vulnerabilities and insecure coding patterns.</p>
            <table>
              <thead>
                <tr>
                  <th>Severity</th>
                  <th>Rule ID</th>
                  <th>File</th>
                  <th>Line</th>
                  <th>Message & Code Snippet</th>
                </tr>
              </thead>
              <tbody>
                {rows_html}
              </tbody>
            </table>
          </div>
        </div>
      </body>
      </html>"""

      with open("artifacts/semgrep.html", "w") as f:
          f.write(html_doc)
      print(f"HTML RPT: artifacts/semgrep.html ({findings_count} findings)")
      EOF

      echo ""
      echo "============================================================"
      echo ""

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/semgrep*


# ============================================================
# 4. SCA DEPENDENCY SCANNING - SNYK (snyk.html)
# ============================================================

check_sca_snyk:
  stage: check
  allow_failure: true

  image:
    name: snyk/snyk:golang
    entrypoint: [""]

  script:
    - |
      mkdir -p artifacts

      echo ""
      echo "============================================================"
      echo "           SCA DEPENDENCY SCANNING - SNYK"
      echo "============================================================"
      echo ""

      if [ -z "$SNYK_TOKEN" ]; then
        echo "WARNING : SNYK_TOKEN is not set. Skipping Snyk scan."
        cat > artifacts/snyk-summary.json << 'EOF'
      {
        "check": "snyk",
        "result": "SKIPPED",
        "findings": 0,
        "detail": "SNYK_TOKEN is not configured."
      }
      EOF
        cat > artifacts/snyk.html << 'EOF'
      <!DOCTYPE html><html><body style="font-family:sans-serif;padding:30px;background:#0f172a;color:#f8fafc;">
      <h2>Snyk SCA Scan Skipped</h2><p>SNYK_TOKEN variable is not configured.</p>
      <a href="security-reports.html" style="color:#38bdf8;">&larr; Back to Dashboard</a>
      </body></html>
      EOF
        exit 0
      fi

      echo "--> Running Snyk dependency test..."
      echo "--> SNYK_TOKEN detected (length: ${#SNYK_TOKEN} chars)"
      export SNYK_TOKEN="$SNYK_TOKEN"
      # Run test and capture json output (snyk exits non-zero if vulnerabilities are found)
      snyk test --json > artifacts/snyk-raw.json || true

      # Convert to HTML report using snyk-to-html if installed
      if command -v snyk-to-html >/dev/null 2>&1; then
        snyk-to-html -i artifacts/snyk-raw.json -o artifacts/snyk.html || true
      fi

      # Parse summary and generate clean HTML report using Go
      cat << 'GOEOF' > /tmp/parse_snyk.go
      package main

      import (
      	"encoding/json"
      	"fmt"
      	"html"
      	"os"
      	"strings"
      )

      type Vuln struct {
      	ID       string      `json:"id"`
      	Title    string      `json:"title"`
      	Name     string      `json:"name"`
      	Version  string      `json:"version"`
      	Severity string      `json:"severity"`
      	FixedIn  interface{} `json:"fixedIn"`
      }

      type SnykOutput struct {
      	Vulnerabilities []Vuln `json:"vulnerabilities"`
      	Summary         string `json:"summary"`
      	Error           string `json:"error"`
      }

      func main() {
      	bytes, err := os.ReadFile("artifacts/snyk-raw.json")
      	var vulns []Vuln
      	var errMsg string
      	var summaryText string

      	if err == nil {
      		var single SnykOutput
      		if err := json.Unmarshal(bytes, &single); err == nil {
      			vulns = single.Vulnerabilities
      			errMsg = single.Error
      			summaryText = single.Summary
      		} else {
      			var multi []SnykOutput
      			if err := json.Unmarshal(bytes, &multi); err == nil {
      				for _, m := range multi {
      					vulns = append(vulns, m.Vulnerabilities...)
      					if m.Summary != "" {
      						summaryText += m.Summary + "; "
      					}
      				}
      			}
      		}
      	}

      	total := len(vulns)
      	status := "PASS"
      	detail := "No vulnerable dependencies detected."
      	if errMsg != "" {
      		status = "ERROR"
      		detail = "Snyk error: " + errMsg
      	} else if total > 0 {
      		status = "REVIEW"
      		detail = fmt.Sprintf("%d dependency vulnerabilities detected.", total)
      	}

      	summaryJSON := fmt.Sprintf(`{"check":"snyk","result":"%s","findings":%d,"detail":"%s"}`, status, total, detail)
      	_ = os.WriteFile("artifacts/snyk-summary.json", []byte(summaryJSON), 0644)

      	var rows strings.Builder
      	for _, v := range vulns {
      		sev := strings.ToLower(v.Severity)
      		title := html.EscapeString(v.Title)
      		if title == "" {
      			title = html.EscapeString(v.ID)
      		}
      		pkg := html.EscapeString(fmt.Sprintf("%s@%s", v.Name, v.Version))
      		rows.WriteString(fmt.Sprintf(`<tr><td><span class="badge %s">%s</span></td><td class="rule">%s</td><td class="file">%s</td><td>%v</td></tr>`, sev, strings.ToUpper(sev), title, pkg, v.FixedIn))
      	}

      	rowsHTML := rows.String()
      	if rowsHTML == "" {
      		if status == "ERROR" {
      			rowsHTML = fmt.Sprintf(`<tr><td colspan="4" class="no-findings" style="color:#fda4af;">⚠ Snyk error: %s</td></tr>`, html.EscapeString(errMsg))
      		} else {
      			rowsHTML = `<tr><td colspan="4" class="no-findings">✓ No vulnerable dependencies found in packages!</td></tr>`
      		}
      	}

      	const htmlTemplate = `<!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8"><title>Snyk Dependency Security Report</title>
        <style>
          body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }
          .container { max-width: 1200px; margin: 0 auto; }
          .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
          h1 { color: #38bdf8; margin: 0; font-size: 24px; }
          .back-btn { padding: 8px 14px; background: #334155; color: #e2e8f0; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 500; }
          .card { background: #1e293b; border-radius: 8px; padding: 20px; }
          table { width: 100%; border-collapse: collapse; margin-top: 12px; }
          th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }
          th { background: #0f172a; color: #94a3b8; text-transform: uppercase; font-size: 11px; }
          .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }
          .badge.critical, .badge.high { background: #881337; color: #fda4af; }
          .badge.medium { background: #78350f; color: #fde68a; }
          .badge.low, .badge.info { background: #1e3a8a; color: #93c5fd; }
          .rule { font-weight: 600; color: #fbbf24; }
          .file { font-family: monospace; color: #38bdf8; }
          .no-findings { text-align: center; padding: 32px; color: #34d399; font-size: 16px; font-weight: bold; }
        </style>
      </head>
      <body>
        <div class="container"><div class="card">
          <div class="header"><h1>📦 Snyk Open Source SCA Report</h1><a href="security-reports.html" class="back-btn">&larr; Back to Dashboard</a></div>
          <p style="color:#94a3b8;font-size:14px;">Scanned project dependencies for known CVEs and security advisories.</p>
          <table><thead><tr><th>Severity</th><th>Vulnerability</th><th>Package</th><th>Remediation / Fix</th></tr></thead>
          <tbody>{{ROWS_CONTENT}}</tbody>
          </table>
        </div></div>
      </body></html>`

      	htmlDoc := strings.Replace(htmlTemplate, "{{ROWS_CONTENT}}", rowsHTML, 1)
      	_ = os.WriteFile("artifacts/snyk.html", []byte(htmlDoc), 0644)
      }
      GOEOF
      go run /tmp/parse_snyk.go || true

      echo ""
      echo "------------------------------------------------------------"
      if [ -f "artifacts/snyk-summary.json" ]; then
        cat artifacts/snyk-summary.json
      fi
      echo "------------------------------------------------------------"
      echo "HTML RPT: artifacts/snyk.html"
      echo "NOTE    : This check is informational and does not block"
      echo "          the pipeline."
      echo "============================================================"
      echo ""

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/snyk*


# ============================================================
# 5. CONTAINER SCANNING - SNYK (snyk-container.html)
# ============================================================

check_container_snyk:
  stage: check
  allow_failure: true

  image:
    name: snyk/snyk:docker
    entrypoint: [""]

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    SNYK_SKIP_UPDATE_CHECK: "true"

  script:
    - |
      mkdir -p artifacts

      echo ""
      echo "============================================================"
      echo "           CONTAINER SCANNING - SNYK CONTAINER"
      echo "============================================================"
      echo ""

      if [ -z "$SNYK_TOKEN" ]; then
        echo "WARNING : SNYK_TOKEN is not set. Skipping Snyk Container scan."
        cat > artifacts/snyk-container-summary.json << 'EOF'
      {
        "check": "snyk-container",
        "result": "SKIPPED",
        "findings": 0,
        "detail": "SNYK_TOKEN is not configured."
      }
      EOF
        cat > artifacts/snyk-container.html << 'EOF'
      <!DOCTYPE html><html><body style="font-family:sans-serif;padding:30px;background:#0f172a;color:#f8fafc;">
      <h2>Snyk Container Scan Skipped</h2><p>SNYK_TOKEN variable is not configured.</p>
      <a href="security-reports.html" style="color:#38bdf8;">&larr; Back to Dashboard</a>
      </body></html>
      EOF
        exit 0
      fi

      echo "--> Waiting for Docker daemon to become ready..."
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is ready!"
          break
        fi
        echo "Waiting for Docker daemon ($i/30)..."
        sleep 1
      done

      echo "--> Building local container image for scanning..."
      docker build -t app-scan:local -f Dockerfile . || true

      echo "--> Running Snyk Container test..."
      echo "--> SNYK_TOKEN detected (length: ${#SNYK_TOKEN} chars)"
      export SNYK_TOKEN="$SNYK_TOKEN"

      # Run container test and capture json output (snyk exits non-zero if vulnerabilities are found)
      snyk container test app-scan:local --file=Dockerfile --json > artifacts/snyk-container-raw.json || true

      # Convert to HTML report using snyk-to-html if installed
      if command -v snyk-to-html >/dev/null 2>&1; then
        snyk-to-html -i artifacts/snyk-container-raw.json -o artifacts/snyk-container.html || true
      fi

      # Parse output and generate modern dark-mode HTML report using Python
      if ! command -v python3 >/dev/null 2>&1; then
        echo "--> Installing python3 for report generation..."
        apk add --no-cache python3 >/dev/null 2>&1 || true
      fi

      if command -v python3 >/dev/null 2>&1; then
        python3 - << 'PYEOF'
      import json, html, os, sys

      raw_file = "artifacts/snyk-container-raw.json"
      vulns = []
      err_msg = ""
      base_image = ""

      if os.path.exists(raw_file):
          try:
              with open(raw_file, "r") as f:
                  content = f.read().strip()
              if content:
                  try:
                      data = json.loads(content)
                  except Exception:
                      start = min([i for i in [content.find('{'), content.find('[')] if i != -1], default=-1)
                      end = max(content.rfind('}'), content.rfind(']'))
                      if start != -1 and end != -1 and end > start:
                          data = json.loads(content[start:end+1])
                      else:
                          data = {}
                  
                  if isinstance(data, list):
                      for item in data:
                          vulns.extend(item.get("vulnerabilities", []))
                          if not base_image and item.get("docker", {}).get("baseImage"):
                              base_image = item.get("docker", {}).get("baseImage", "")
                          if item.get("error") and not err_msg:
                              err_msg = item.get("error")
                  elif isinstance(data, dict):
                      vulns = data.get("vulnerabilities", [])
                      base_image = data.get("docker", {}).get("baseImage", "")
                      err_msg = data.get("error", "")
                      if not err_msg and data.get("message"):
                          err_msg = data.get("message")
          except Exception as e:
              err_msg = f"Error reading Snyk JSON: {e}"
      else:
          err_msg = "Scan output artifacts/snyk-container-raw.json not found"

      total = len(vulns)
      if err_msg and total == 0:
          status = "ERROR"
          detail = f"Snyk error: {err_msg}"
      elif total > 0:
          high_crit = sum(1 for v in vulns if str(v.get("severity", "")).lower() in ["high", "critical"])
          status = "REVIEW"
          if high_crit > 0:
              detail = f"{total} vulnerabilities detected ({high_crit} HIGH/CRITICAL) in container image."
          else:
              detail = f"{total} vulnerabilities detected in container image."
      else:
          status = "PASS"
          detail = "No container image vulnerabilities detected."

      summary_data = {
          "check": "snyk-container",
          "result": status,
          "findings": total,
          "detail": detail
      }
      with open("artifacts/snyk-container-summary.json", "w") as f:
          json.dump(summary_data, f, indent=2)

      rows = []
      for v in vulns:
          sev = str(v.get("severity", "info")).lower()
          title = html.escape(str(v.get("title") or v.get("id") or "Vulnerability"))
          vuln_id = html.escape(str(v.get("id", "")))
          pkg_name = str(v.get("packageName") or v.get("name") or "unknown")
          pkg_ver = str(v.get("version") or "")
          pkg = html.escape(f"{pkg_name}@{pkg_ver}" if pkg_ver else pkg_name)

          fixed_in = v.get("nearestFixedInVersion") or v.get("fixedIn")
          if isinstance(fixed_in, list):
              fixed_str = ", ".join(str(x) for x in fixed_in)
          elif fixed_in:
              fixed_str = str(fixed_in)
          else:
              fixed_str = "None"
          fixed_str = html.escape(fixed_str)

          rows.append(f"""<tr>
            <td><span class="badge {sev}">{sev.upper()}</span></td>
            <td class="rule">{title} <span style="font-size:11px;color:#94a3b8;">({vuln_id})</span></td>
            <td class="file">{pkg}</td>
            <td>{fixed_str}</td>
          </tr>""")

      rows_html = "".join(rows) if rows else ""
      if not rows_html:
          if status == "ERROR":
              rows_html = f'<tr><td colspan="4" class="no-findings" style="color:#fda4af;">⚠ Snyk container error: {html.escape(err_msg)}</td></tr>'
          else:
              rows_html = '<tr><td colspan="4" class="no-findings">✓ No container image vulnerabilities found!</td></tr>'

      base_info = f"Base Image: {html.escape(base_image)} | " if base_image else ""
      html_doc = f"""<!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8"><title>Snyk Container Security Report</title>
        <style>
          body {{ font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }}
          .container {{ max-width: 1200px; margin: 0 auto; }}
          .header {{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }}
          h1 {{ color: #38bdf8; margin: 0; font-size: 24px; }}
          .back-btn {{ padding: 8px 14px; background: #334155; color: #e2e8f0; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 500; }}
          .card {{ background: #1e293b; border-radius: 8px; padding: 20px; }}
          table {{ width: 100%; border-collapse: collapse; margin-top: 12px; }}
          th, td {{ padding: 12px 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }}
          th {{ background: #0f172a; color: #94a3b8; text-transform: uppercase; font-size: 11px; }}
          .badge {{ padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; text-transform: uppercase; }}
          .badge.critical, .badge.high {{ background: #881337; color: #fda4af; }}
          .badge.medium {{ background: #78350f; color: #fde68a; }}
          .badge.low, .badge.info {{ background: #1e3a8a; color: #93c5fd; }}
          .rule {{ font-weight: 600; color: #fbbf24; }}
          .file {{ font-family: monospace; color: #38bdf8; }}
          .no-findings {{ text-align: center; padding: 32px; color: #34d399; font-size: 16px; font-weight: bold; }}
        </style>
      </head>
      <body>
        <div class="container"><div class="card">
          <div class="header"><h1>🐳 Snyk Container Security Report</h1><a href="security-reports.html" class="back-btn">&larr; Back to Dashboard</a></div>
          <p style="color:#94a3b8;font-size:14px;">{base_info}Scanned container base image and OS packages for vulnerabilities and security advisories.</p>
          <table><thead><tr><th>Severity</th><th>Vulnerability</th><th>Package</th><th>Remediation / Fix</th></tr></thead>
          <tbody>{rows_html}</tbody>
          </table>
        </div></div>
      </body></html>"""

      with open("artifacts/snyk-container.html", "w") as f:
          f.write(html_doc)
      print(f"HTML RPT: artifacts/snyk-container.html ({total} findings)")
      PYEOF
      fi

      # Shell fallback if python report was not generated
      if [ ! -f "artifacts/snyk-container-summary.json" ]; then
        cat > artifacts/snyk-container-summary.json << 'EOF'
      {
        "check": "snyk-container",
        "result": "REVIEW",
        "findings": 0,
        "detail": "Container scan completed. Inspect artifacts/snyk-container-raw.json"
      }
      EOF
      fi

      echo ""
      echo "------------------------------------------------------------"
      if [ -f "artifacts/snyk-container-summary.json" ]; then
        cat artifacts/snyk-container-summary.json
      fi
      echo "------------------------------------------------------------"
      echo "HTML RPT: artifacts/snyk-container.html"
      echo "NOTE    : This check is informational and does not block"
      echo "          the pipeline."
      echo "============================================================"
      echo ""

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/snyk-container*


# ============================================================
# 6. AGGREGATED REPORT (security-reports.html)
# ============================================================

security_report:
  stage: check
  allow_failure: true

  image: alpine:latest

  needs:
    - job: check_secret_gitleaks
      artifacts: true
    - job: check_sast_trivy
      artifacts: true
    - job: check_code_semgrep
      artifacts: true
    - job: check_sca_snyk
      artifacts: true
    - job: check_container_snyk
      artifacts: true

  script:
    - |
      set +e
      mkdir -p artifacts

      echo ""
      echo "============================================================"
      echo "               AGGREGATED SECURITY REPORT"
      echo "============================================================"
      echo ""

      printf "%-20s %-10s %-10s %-30s\n" "SCANNER" "RESULT" "FINDINGS" "DETAIL"
      echo "--------------------------------------------------------------------------------"

      GITLEAKS_RES="UNKNOWN"
      GITLEAKS_DET="No data"
      TRIVY_RES="UNKNOWN"
      TRIVY_DET="No data"
      SEMGREP_RES="UNKNOWN"
      SEMGREP_DET="No data"
      SNYK_RES="UNKNOWN"
      SNYK_DET="No data"
      SNYK_CONTAINER_RES="UNKNOWN"
      SNYK_CONTAINER_DET="No data"

      if [ -f "artifacts/gitleaks-summary.json" ]; then
        GITLEAKS_RES=$(sed -n 's/.*"result": *"\([^"]*\)".*/\1/p' artifacts/gitleaks-summary.json 2>/dev/null || true)
        FND=$(sed -n 's/.*"findings": *\([0-9]*\).*/\1/p' artifacts/gitleaks-summary.json 2>/dev/null || true)
        GITLEAKS_DET=$(sed -n 's/.*"detail": *"\([^"]*\)".*/\1/p' artifacts/gitleaks-summary.json 2>/dev/null || true)
        [ -z "$GITLEAKS_RES" ] && GITLEAKS_RES="UNKNOWN"
        [ -z "$FND" ] && FND="0"
        [ -z "$GITLEAKS_DET" ] && GITLEAKS_DET="No data"
        printf "%-20s %-10s %-10s %-30s\n" "GitLeaks" "$GITLEAKS_RES" "$FND" "$GITLEAKS_DET"
      fi

      if [ -f "artifacts/trivy-summary.json" ]; then
        TRIVY_RES=$(sed -n 's/.*"result": *"\([^"]*\)".*/\1/p' artifacts/trivy-summary.json 2>/dev/null || true)
        TRIVY_DET=$(sed -n 's/.*"detail": *"\([^"]*\)".*/\1/p' artifacts/trivy-summary.json 2>/dev/null || true)
        [ -z "$TRIVY_RES" ] && TRIVY_RES="UNKNOWN"
        [ -z "$TRIVY_DET" ] && TRIVY_DET="No data"
        printf "%-20s %-10s %-10s %-30s\n" "Trivy" "$TRIVY_RES" "-" "$TRIVY_DET"
      fi

      if [ -f "artifacts/semgrep-summary.json" ]; then
        SEMGREP_RES=$(sed -n 's/.*"result": *"\([^"]*\)".*/\1/p' artifacts/semgrep-summary.json 2>/dev/null || true)
        FND=$(sed -n 's/.*"findings": *\([0-9]*\).*/\1/p' artifacts/semgrep-summary.json 2>/dev/null || true)
        SEMGREP_DET=$(sed -n 's/.*"detail": *"\([^"]*\)".*/\1/p' artifacts/semgrep-summary.json 2>/dev/null || true)
        [ -z "$SEMGREP_RES" ] && SEMGREP_RES="UNKNOWN"
        [ -z "$FND" ] && FND="0"
        [ -z "$SEMGREP_DET" ] && SEMGREP_DET="No data"
        printf "%-20s %-10s %-10s %-30s\n" "Semgrep" "$SEMGREP_RES" "$FND" "$SEMGREP_DET"
      fi

      if [ -f "artifacts/snyk-summary.json" ]; then
        SNYK_RES=$(sed -n 's/.*"result": *"\([^"]*\)".*/\1/p' artifacts/snyk-summary.json 2>/dev/null || true)
        FND=$(sed -n 's/.*"findings": *\([0-9]*\).*/\1/p' artifacts/snyk-summary.json 2>/dev/null || true)
        SNYK_DET=$(sed -n 's/.*"detail": *"\([^"]*\)".*/\1/p' artifacts/snyk-summary.json 2>/dev/null || true)
        [ -z "$SNYK_RES" ] && SNYK_RES="UNKNOWN"
        [ -z "$FND" ] && FND="0"
        [ -z "$SNYK_DET" ] && SNYK_DET="No data"
        printf "%-20s %-10s %-10s %-30s\n" "Snyk" "$SNYK_RES" "$FND" "$SNYK_DET"
      fi

      if [ -f "artifacts/snyk-container-summary.json" ]; then
        SNYK_CONTAINER_RES=$(sed -n 's/.*"result": *"\([^"]*\)".*/\1/p' artifacts/snyk-container-summary.json 2>/dev/null || true)
        FND=$(sed -n 's/.*"findings": *\([0-9]*\).*/\1/p' artifacts/snyk-container-summary.json 2>/dev/null || true)
        SNYK_CONTAINER_DET=$(sed -n 's/.*"detail": *"\([^"]*\)".*/\1/p' artifacts/snyk-container-summary.json 2>/dev/null || true)
        [ -z "$SNYK_CONTAINER_RES" ] && SNYK_CONTAINER_RES="UNKNOWN"
        [ -z "$FND" ] && FND="0"
        [ -z "$SNYK_CONTAINER_DET" ] && SNYK_CONTAINER_DET="No data"
        printf "%-20s %-10s %-10s %-30s\n" "Snyk Container" "$SNYK_CONTAINER_RES" "$FND" "$SNYK_CONTAINER_DET"
      fi

      echo "--------------------------------------------------------------------------------"
      echo ""

      GITLEAKS_BADGE=$(echo "$GITLEAKS_RES" | tr '[:upper:]' '[:lower:]')
      TRIVY_BADGE=$(echo "$TRIVY_RES" | tr '[:upper:]' '[:lower:]')
      SEMGREP_BADGE=$(echo "$SEMGREP_RES" | tr '[:upper:]' '[:lower:]')
      SNYK_BADGE=$(echo "$SNYK_RES" | tr '[:upper:]' '[:lower:]')
      SNYK_CONTAINER_BADGE=$(echo "$SNYK_CONTAINER_RES" | tr '[:upper:]' '[:lower:]')

      # Generate unified security-reports.html dashboard
      cat > artifacts/security-reports.html << EOF
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Security Analysis Dashboard - $CI_PROJECT_NAME</title>
        <style>
          body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b1120; color: #f8fafc; padding: 32px; margin: 0; }
          .container { max-width: 1200px; margin: 0 auto; }
          h1 { color: #38bdf8; margin-bottom: 6px; }
          p.meta { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
          .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
          .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
          .card h2 { margin-top: 0; font-size: 18px; color: #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
          .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
          .badge.pass { background: #065f46; color: #34d399; }
          .badge.review { background: #881337; color: #fda4af; }
          .badge.error { background: #881337; color: #fda4af; }
          .badge.skipped { background: #334155; color: #94a3b8; }
          .detail { color: #cbd5e1; font-size: 14px; margin: 16px 0 24px 0; min-height: 40px; }
          .btn { display: inline-block; padding: 10px 16px; background: #0284c7; color: white; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 13px; }
          .btn:hover { background: #0369a1; }
        </style>
      </head>
      <body>
        <div class="container">
          <h1>🛡️ Security Analysis Dashboard</h1>
          <p class="meta">Project: $CI_PROJECT_NAME | Commit: $CI_COMMIT_SHORT_SHA | Branch: $CI_COMMIT_REF_NAME</p>
          <div class="grid">
            <div class="card">
              <h2>GitLeaks Secret Scan <span class="badge $GITLEAKS_BADGE">$GITLEAKS_RES</span></h2>
              <p class="detail">$GITLEAKS_DET</p>
              <a class="btn" href="gitleaks.html">Open GitLeaks HTML Report &rarr;</a>
            </div>
            <div class="card">
              <h2>Trivy SAST & Vuln <span class="badge $TRIVY_BADGE">$TRIVY_RES</span></h2>
              <p class="detail">$TRIVY_DET</p>
              <a class="btn" href="trivy.html">Open Trivy HTML Report &rarr;</a>
            </div>
            <div class="card">
              <h2>Semgrep Code Scan <span class="badge $SEMGREP_BADGE">$SEMGREP_RES</span></h2>
              <p class="detail">$SEMGREP_DET</p>
              <a class="btn" href="semgrep.html">Open Semgrep HTML Report &rarr;</a>
            </div>
            <div class="card">
              <h2>Snyk SCA Dependencies <span class="badge $SNYK_BADGE">$SNYK_RES</span></h2>
              <p class="detail">$SNYK_DET</p>
              <a class="btn" href="snyk.html">Open Snyk HTML Report &rarr;</a>
            </div>
            <div class="card">
              <h2>Snyk Container <span class="badge $SNYK_CONTAINER_BADGE">$SNYK_CONTAINER_RES</span></h2>
              <p class="detail">$SNYK_CONTAINER_DET</p>
              <a class="btn" href="snyk-container.html">Open Snyk Container Report &rarr;</a>
            </div>
          </div>
        </div>
      </body>
      </html>
      EOF

      echo "DASHBOARD : artifacts/security-reports.html generated successfully."
      echo "============================================================"
      echo ""

  artifacts:
    when: always
    expire_in: 30 days
    name: "security-report-$CI_COMMIT_SHORT_SHA"
    paths:
      - artifacts/


