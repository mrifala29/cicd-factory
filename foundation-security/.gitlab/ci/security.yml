# ============================================================
# SECURITY CHECKS (STAGE: security_scan & report)
# Tools: GitLeaks (Secret Scanning) & Trivy (SAST & Misconfig)
# Artifacts: gitleaks.html, trivy.html, security-reports.html
# ============================================================

# ============================================================
# 1. SECRET SCANNING - GITLEAKS (gitleaks.html)
# ============================================================

check_secret_gitleaks:
  stage: security_scan
  allow_failure: true

  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]

  script:
    - |
      mkdir -p artifacts

      echo ""
      echo "============================================================"
      echo "             SECRET SCANNING - GITLEAKS"
      echo "============================================================"
      echo ""

      # Prepare HTML template for Gitleaks
      cat > /tmp/gitleaks-template.html << 'EOF'
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>GitLeaks Security Report</title>
        <style>
          body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; margin: 0; }
          .container { max-width: 1200px; margin: 0 auto; }
          .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
          h1 { color: #38bdf8; margin: 0; font-size: 24px; }
          .back-btn { padding: 8px 14px; background: #334155; color: #e2e8f0; text-decoration: none; border-radius: 6px; font-size: 13px; font-weight: 500; }
          .back-btn:hover { background: #475569; }
          p.subtitle { color: #94a3b8; margin-top: 6px; margin-bottom: 24px; font-size: 14px; }
          .card { background: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
          table { width: 100%; border-collapse: collapse; margin-top: 12px; }
          th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }
          th { background: #0f172a; color: #94a3b8; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
          tr:hover { background: #273549; }
          .rule { font-weight: 600; color: #fbbf24; }
          .file { font-family: monospace; color: #38bdf8; }
          .secret { font-family: monospace; color: #f43f5e; background: #3f121e; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
          .no-findings { text-align: center; padding: 32px; color: #34d399; font-size: 16px; font-weight: bold; }
        </style>
      </head>
      <body>
        <div class="container">
          <div class="card">
            <div class="header">
              <h1>🛡️ GitLeaks Secret Detection Report</h1>
              <a href="security-reports.html" class="back-btn">&larr; Back to Dashboard</a>
            </div>
            <p class="subtitle">Automated scan for hardcoded credentials, API keys, and sensitive tokens.</p>
            <table>
              <thead>
                <tr>
                  <th>Rule ID</th>
                  <th>Description</th>
                  <th>File</th>
                  <th>Line</th>
                  <th>Secret Snippet</th>
                  <th>Commit / Author</th>
                </tr>
              </thead>
              <tbody>
              {{range .}}
                <tr>
                  <td><span class="rule">{{.RuleID}}</span></td>
                  <td>{{.Description}}</td>
                  <td><span class="file">{{.File}}</span></td>
                  <td>{{.StartLine}}</td>
                  <td><span class="secret">{{.Secret}}</span></td>
                  <td>{{.Commit}}<br><small style="color: #94a3b8;">{{.Author}}</small></td>
                </tr>
              {{else}}
                <tr>
                  <td colspan="6" class="no-findings">✓ No hardcoded secrets or credentials detected!</td>
                </tr>
              {{end}}
              </tbody>
            </table>
          </div>
        </div>
      </body>
      </html>
      EOF

      CONFIG_ARG=""
      if [ -f .gitleaks.toml ]; then
        CONFIG_ARG="--config .gitleaks.toml"
      fi

      # 1. Output plain text report for console & markdown
      gitleaks detect \
        --source . \
        $CONFIG_ARG \
        --verbose \
        --report-format json \
        --report-path artifacts/gitleaks.json \
        > artifacts/gitleaks.md 2>&1 || true

      cat artifacts/gitleaks.md

      # 2. Output HTML report
      gitleaks detect \
        --source . \
        $CONFIG_ARG \
        --report-format template \
        --report-template /tmp/gitleaks-template.html \
        --report-path artifacts/gitleaks.html 2>/dev/null || true

      echo ""
      echo "------------------------------------------------------------"

      if [ ! -s artifacts/gitleaks.json ] || \
         [ "$(cat artifacts/gitleaks.json)" = "[]" ]; then

        RESULT="PASS"
        DETAIL="No secrets or credentials detected."
        FINDINGS=0

      else

        RESULT="REVIEW"
        DETAIL="Potential secret findings may require review."
        FINDINGS=$(grep -o '"RuleID"' artifacts/gitleaks.json | wc -l)

      fi

      echo "RESULT  : $RESULT"
      echo "DETAIL  : $DETAIL"
      echo "FINDINGS: $FINDINGS"
      echo "HTML RPT: artifacts/gitleaks.html"

      echo ""
      echo "NOTE    : This check is informational and does not block"
      echo "          the pipeline."
      echo "============================================================"
      echo ""

      cat > artifacts/gitleaks-summary.json <<EOF
      {
        "check": "gitleaks",
        "result": "$RESULT",
        "findings": $FINDINGS,
        "detail": "$DETAIL"
      }
      EOF

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/gitleaks*


# ============================================================
# 2. SAST & MISCONFIG - TRIVY (trivy.html)
# ============================================================

check_sast_trivy:
  stage: security_scan
  allow_failure: true

  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - |
      mkdir -p artifacts

      echo ""
      echo "============================================================"
      echo "                 SAST & MISCONFIG - TRIVY"
      echo "============================================================"
      echo ""

      OUTPUT=$(mktemp)

      # 1. Scan console output
      trivy fs \
        --scanners misconfig,vuln \
        --severity HIGH,CRITICAL \
        --exit-code 0 \
        . > "$OUTPUT" 2>&1 || true

      cat "$OUTPUT"
      cp "$OUTPUT" artifacts/trivy.md

      # 2. Generate JSON report
      trivy fs \
        --scanners misconfig,vuln \
        --severity HIGH,CRITICAL \
        --format json \
        --output artifacts/trivy.json \
        . 2>/dev/null || echo "{}" > artifacts/trivy.json

      # 3. Generate HTML report using official built-in template
      trivy fs \
        --scanners misconfig,vuln \
        --severity HIGH,CRITICAL \
        --format template \
        --template "@/contrib/html.tpl" \
        --output artifacts/trivy.html \
        . 2>/dev/null || true

      echo ""
      echo "------------------------------------------------------------"

      if grep -q "Total: 0" "$OUTPUT" || ! grep -q -E "HIGH|CRITICAL" "$OUTPUT"; then
        RESULT="PASS"
        DETAIL="No HIGH/CRITICAL SAST or misconfiguration issues detected."
      else
        RESULT="REVIEW"
        DETAIL="Potential HIGH/CRITICAL issues detected by Trivy."
      fi

      echo "RESULT  : $RESULT"
      echo "DETAIL  : $DETAIL"
      echo "HTML RPT: artifacts/trivy.html"

      echo ""
      echo "NOTE    : This check is informational and does not block"
      echo "          the pipeline."
      echo "============================================================"
      echo ""

      cat > artifacts/trivy-summary.json <<EOF
      {
        "check": "trivy-sast",
        "result": "$RESULT",
        "detail": "$DETAIL"
      }
      EOF

  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/trivy*


# ============================================================
# 3. AGGREGATED REPORT (security-reports.html)
# ============================================================

security_report:
  stage: report

  image: alpine:latest

  needs:
    - job: check_secret_gitleaks
      artifacts: true
    - job: check_sast_trivy
      artifacts: true

  script:
    - |
      echo ""
      echo "============================================================"
      echo "               AGGREGATED SECURITY REPORT"
      echo "============================================================"
      echo ""

      printf "%-20s %-10s %-10s %-30s\n" "SCANNER" "RESULT" "FINDINGS" "DETAIL"
      echo "--------------------------------------------------------------------------------"

      GITLEAKS_RES="UNKNOWN"
      GITLEAKS_DET="No data"
      TRIVY_RES="UNKNOWN"
      TRIVY_DET="No data"

      if [ -f "artifacts/gitleaks-summary.json" ]; then
        GITLEAKS_RES=$(grep -o '"result": "[^"]*"' artifacts/gitleaks-summary.json | cut -d'"' -f4)
        FND=$(grep -o '"findings": [0-9]*' artifacts/gitleaks-summary.json | awk '{print $2}')
        GITLEAKS_DET=$(grep -o '"detail": "[^"]*"' artifacts/gitleaks-summary.json | cut -d'"' -f4)
        printf "%-20s %-10s %-10s %-30s\n" "GitLeaks" "$GITLEAKS_RES" "$FND" "$GITLEAKS_DET"
      fi

      if [ -f "artifacts/trivy-summary.json" ]; then
        TRIVY_RES=$(grep -o '"result": "[^"]*"' artifacts/trivy-summary.json | cut -d'"' -f4)
        TRIVY_DET=$(grep -o '"detail": "[^"]*"' artifacts/trivy-summary.json | cut -d'"' -f4)
        printf "%-20s %-10s %-10s %-30s\n" "Trivy" "$TRIVY_RES" "-" "$TRIVY_DET"
      fi

      echo "--------------------------------------------------------------------------------"
      echo ""

      # Generate unified security-reports.html dashboard
      cat > artifacts/security-reports.html << EOF
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8">
        <title>Security Analysis Dashboard - $CI_PROJECT_NAME</title>
        <style>
          body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b1120; color: #f8fafc; padding: 32px; margin: 0; }
          .container { max-width: 900px; margin: 0 auto; }
          h1 { color: #38bdf8; margin-bottom: 6px; }
          p.meta { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
          .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
          .card { background: #1e293b; border-radius: 12px; padding: 24px; border: 1px solid #334155; }
          .card h2 { margin-top: 0; font-size: 18px; color: #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
          .badge { padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }
          .badge.pass { background: #065f46; color: #34d399; }
          .badge.review { background: #881337; color: #fda4af; }
          .detail { color: #cbd5e1; font-size: 14px; margin: 16px 0 24px 0; min-height: 40px; }
          .btn { display: inline-block; padding: 10px 16px; background: #0284c7; color: white; text-decoration: none; border-radius: 6px; font-weight: 500; font-size: 13px; }
          .btn:hover { background: #0369a1; }
        </style>
      </head>
      <body>
        <div class="container">
          <h1>🛡️ Security Analysis Dashboard</h1>
          <p class="meta">Project: $CI_PROJECT_NAME | Commit: $CI_COMMIT_SHORT_SHA | Branch: $CI_COMMIT_REF_NAME</p>
          <div class="grid">
            <div class="card">
              <h2>GitLeaks Secret Scan <span class="badge \$(echo $GITLEAKS_RES | tr '[:upper:]' '[:lower:]')">$GITLEAKS_RES</span></h2>
              <p class="detail">$GITLEAKS_DET</p>
              <a class="btn" href="gitleaks.html">Open GitLeaks HTML Report &rarr;</a>
            </div>
            <div class="card">
              <h2>Trivy SAST & Vuln <span class="badge \$(echo $TRIVY_RES | tr '[:upper:]' '[:lower:]')">$TRIVY_RES</span></h2>
              <p class="detail">$TRIVY_DET</p>
              <a class="btn" href="trivy.html">Open Trivy HTML Report &rarr;</a>
            </div>
          </div>
        </div>
      </body>
      </html>
      EOF

      echo "DASHBOARD : artifacts/security-reports.html generated successfully."
      echo "============================================================"
      echo ""

  artifacts:
    when: always
    expire_in: 30 days
    name: "security-report-$CI_COMMIT_SHORT_SHA"
    paths:
      - artifacts/


