stages:
  - check
  - build
  - deploy
  - verify

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  DOCKER_TLS_CERTDIR: ""
  SNYK_TOKEN: "$SNYK_TOKEN"

include:
  - local: ".gitlab/ci/security.yml"
  - local: ".gitlab/ci/build.yml"
  - local: ".gitlab/ci/deploy.yml"
  - local: ".gitlab/ci/verify.yml"